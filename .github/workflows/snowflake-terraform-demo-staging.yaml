name: "STAGING ENV: Snowflake Terraform Demo Workflow"

on:
  push:
    branches:
      - staging

jobs:
  deploy-terraform-staging:
    name: "Plan & Deploy Terraform plan on Staging"
    runs-on: ubuntu-latest
    permissions:
      contents: read          
      id-token: write         
      pull-requests: write 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate to Google Cloud
      - id: auth
        name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        id: init
        run: |
          # If you keep backend settings in ./staging/backend.hcl, use:
          # terraform -chdir=./staging init -reconfigure -backend-config=backend.hcl
          terraform -chdir=./staging init

      - name: Terraform Format
        id: fmt
        run: terraform -chdir=./staging fmt -recursive -check

      - name: Terraform Validate
        id: validate
        run: terraform -chdir=./staging validate -no-color

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_snowflake_private_key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          TF_VAR_snowflake_private_key_passphrase: ${{ secrets.SNOWFLAKE_PASSPHRASE }}
          TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_USERNAME }}
          TF_VAR_snowflake_account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          TF_VAR_snowflake_role: ${{ secrets.SNOWFLAKE_ROLE }}
        run: terraform -chdir=./staging plan -no-color -input=false

      - name: Terraform Apply
        id: apply
        env:
          TF_VAR_snowflake_private_key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          TF_VAR_snowflake_private_key_passphrase: ${{ secrets.SNOWFLAKE_PASSPHRASE }}
          TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_USERNAME }}
          TF_VAR_snowflake_account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          TF_VAR_snowflake_role: ${{ secrets.SNOWFLAKE_ROLE }}
        run: terraform -chdir=./staging apply -auto-approve -input=false
